<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lil Tezar App</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px;
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid red;
}

.subscribe{
background:red;
color:white;
padding:6px 12px;
border-radius:20px;
text-decoration:none;
}

/* SEARCH */
#searchBox{
width:90%;
margin:10px;
padding:10px;
border:none;
border-radius:10px;
}

/* SONG LIST */
.song{
display:flex;
background:#1a1a1a;
padding:10px;
border-radius:12px;
margin:10px;
cursor:pointer;
}

.song img{
width:55px;
height:55px;
border-radius:10px;
margin-right:10px;
}

/* PLAYER FULLSCREEN */
#playerBox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

#playerBox img{
width:220px;
border-radius:15px;
margin-bottom:20px;
}

.controls button{
background:#222;
color:white;
border:none;
padding:12px;
margin:5px;
border-radius:10px;
font-size:18px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="profile">
<img src="profile.jpg">
<div>
<b>Lil Tezar</b><br>
<small style="color:#aaa;">Artist</small>
</div>
</div>

<a href="https://www.youtube.com/@LILTEZAR-artist" target="_blank" class="subscribe">
▶ Subscribe
</a>
</div>

<!-- SEARCH -->
<input id="searchBox" placeholder="Search songs...">

<!-- SONG LIST -->
<div id="songList"></div>

<!-- PLAYER -->
<div id="playerBox">

<!-- BACK BUTTON -->
<div style="position:absolute;top:15px;left:15px;">
<button onclick="goBack()">⬅️</button>
</div>

<img id="cover">
<h3 id="title"></h3>

<audio id="audio"></audio>

<div class="controls">
<button onclick="prevSong()">⏪</button>
<button id="playBtn" onclick="togglePlay()">▶️</button>
<button onclick="nextSong()">⏩</button>
<br>
<button id="downloadBtn">⬇ Download</button>
</div>

</div>

<script>
const SUPABASE_URL = "https://ujuwvkzzxiwqcfhptaup.supabase.co";
const SUPABASE_KEY = "sb_publishable_7zCr4dg-xaj7I7syGO685g_Fk_fIbFS";

let songs = [];
let current = 0;
let playing = false;

const audio = document.getElementById("audio");

/* LOAD SONGS */
async function loadSongs(){
try{
const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*`,{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
});

const data = await res.json();

if(!Array.isArray(data)){
alert("Error loading songs");
return;
}

songs = data;

if(songs.length === 0){
songList.innerHTML = "<p style='padding:15px;'>No songs found</p>";
return;
}

renderSongs(songs);

}catch(err){
console.log(err);
alert("Failed to load songs");
}
}

/* RENDER SONGS */
function renderSongs(list){
songList.innerHTML = "";

list.forEach((song,i)=>{
songList.innerHTML += `
<div class="song" onclick="openPlayer(${i})">
<img src="${song.cover_url}">
<div>
<b>${song.title}</b><br>
<small>${song.artist}</small>
</div>
</div>`;
});
}

/* SEARCH */
searchBox.addEventListener("input",function(){
const v = this.value.toLowerCase();

renderSongs(
songs.filter(s =>
(s.title||"").toLowerCase().includes(v) ||
(s.artist||"").toLowerCase().includes(v)
)
);
});

/* OPEN PLAYER */
function openPlayer(i){
current = i;
const song = songs[i];

cover.src = song.cover_url;
title.innerText = song.title;

audio.src = song.audio_url;
audio.play();

playing = true;
playBtn.innerText = "⏸";

playerBox.style.display = "flex";

downloadBtn.onclick = ()=>window.open(song.audio_url);
}

/* BACK */
function goBack(){
audio.pause();
playerBox.style.display = "none";
}

/* PLAY/PAUSE */
function togglePlay(){
if(playing){
audio.pause();
playBtn.innerText = "▶️";
playing=false;
}else{
audio.play();
playBtn.innerText = "⏸";
playing=true;
}
}

/* NEXT */
function nextSong(){
current = (current+1)%songs.length;
openPlayer(current);
}

/* PREVIOUS */
function prevSong(){
current = (current-1+songs.length)%songs.length;
openPlayer(current);
}

/* INIT */
loadSongs();
</script>

</body>
</html>
