<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- APP LOOK -->
  <meta name="theme-color" content="#0b0b0b">

  <title>Lil Tezar Music</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111;
      border-bottom: 1px solid #222;
    }

    header h1 {
      font-size: 22px;
    }

    header p {
      font-size: 13px;
      color: #888;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px 15px 120px;
    }

    /* PROFILE */

    .artist-profile {
      background: linear-gradient(145deg, #191919, #101010);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-bottom: 25px;
    }

    .artist-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #333, #111);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      margin: auto;
    }

    .verified {
      color: #4da6ff;
      font-size: 14px;
    }

    .artist-role {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
    }

    .bio {
      color: #bbb;
      font-size: 14px;
      margin: 10px 0;
    }

    .follow-btn {
      background: white;
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* MUSIC */

    .song {
      background: #151515;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .cover {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      background: #222;
    }

    .info {
      flex: 1;
    }

    .title {
      font-size: 15px;
      font-weight: bold;
    }

    .artist {
      font-size: 13px;
      color: #aaa;
    }

    .buttons {
      margin-top: 5px;
    }

    button {
      border: none;
      padding: 7px 12px;
      border-radius: 15px;
      font-size: 12px;
      cursor: pointer;
    }

    .play {
      background: white;
      color: black;
    }

    .download {
      background: #292929;
      color: white;
    }

    /* PLAYER */

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #151515;
      padding: 10px;
      border-top: 1px solid #333;
      display: none;
    }

    audio {
      width: 100%;
    }

    /* STATUS */

    .status {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }

    /* SOCIAL */

    .social {
      text-align: center;
      margin-top: 20px;
    }

    .social a {
      color: #aaa;
      margin: 5px;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 LIL TEZAR</h1>
  <p>Music • Stories • Vibes</p>
</header>

<div class="container">

  <section class="artist-profile">
    <div class="artist-avatar">LT</div>

    <h2>LIL TEZAR <span class="verified">✔</span></h2>

    <div class="artist-role">Artist • Songwriter</div>

    <p class="bio">
      Real pain. Real stories. No fake love.
    </p>

    <a href="https://push.fm/fl/D4UbsKin" target="_blank">
      <button class="follow-btn">Follow</button>
    </a>

    <div class="status" id="status">Checking connection...</div>
  </section>

  <h2>Latest Music</h2>

  <div id="songs">Loading...</div>

  <div class="social">
    <h3>Connect</h3>
    <a href="#">TikTok</a>
    <a href="#">YouTube</a>
    <a href="#">Instagram</a>
  </div>

</div>

<div class="player" id="player">
  <audio id="audio" controls></audio>
</div>

<script>
const SUPABASE_URL = "https://ujuwvkzzxiwqcfhptaup.supabase.co";
const SUPABASE_KEY = "sb_publishable_7zCr4dg-xaj7I7syGO685g_Fk_fIbFS";

const songsDiv = document.getElementById("songs");
const audio = document.getElementById("audio");
const player = document.getElementById("player");
const statusText = document.getElementById("status");

/* ONLINE / OFFLINE DETECTOR */
function updateStatus() {
  if (navigator.onLine) {
    statusText.textContent = "🟢 Online";
  } else {
    statusText.textContent = "🔴 Offline (cached mode)";
  }
}

window.addEventListener("online", updateStatus);
window.addEventListener("offline", updateStatus);
updateStatus();

/* LOAD SONGS */
async function loadSongs() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    });

    const songs = await res.json();
    songsDiv.innerHTML = "";

    songs.forEach(song => {
      const el = document.createElement("div");
      el.className = "song";

      el.innerHTML = `
        <div class="cover"></div>
        <div class="info">
          <div class="title">${song.title}</div>
          <div class="artist">${song.artist}</div>
          <div class="buttons">
            <button class="play">▶</button>
            <button class="download">⬇</button>
          </div>
        </div>
      `;

      el.querySelector(".play").onclick = () => {
        audio.src = song.audio_url;
        player.style.display = "block";
        audio.play();
      };

      el.querySelector(".download").onclick = () => {
        window.open(song.audio_url);
      };

      songsDiv.appendChild(el);
    });

  } catch {
    songsDiv.innerHTML = "⚠️ Offline: Cannot load songs";
  }
}

loadSongs();

/* SERVICE WORKER REGISTER */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>
</html>
