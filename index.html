<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lil Tezar App</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px;
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid red;
}

.subscribe{
background:red;
color:white;
padding:6px 12px;
border-radius:20px;
text-decoration:none;
}

#searchBox{
width:90%;
margin:10px;
padding:10px;
border:none;
border-radius:10px;
}

.song{
display:flex;
background:#1a1a1a;
padding:10px;
border-radius:12px;
margin:10px;
cursor:pointer;
}

.song img{
width:55px;
height:55px;
border-radius:10px;
margin-right:10px;
}

#playerBox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:999;
padding:20px;
text-align:center;
}

#playerBox img{
width:200px;
border-radius:15px;
margin-top:40px;
}

.controls button{
background:#222;
color:white;
border:none;
padding:10px;
margin:5px;
border-radius:10px;
font-size:16px;
}

#adminLogin, #adminPanel{
padding:15px;
}

input{
width:100%;
padding:8px;
margin-bottom:8px;
border-radius:8px;
border:none;
}
</style>
</head>

<body>

<div class="header">
<div class="profile">
<img src="profile.jpg">
<div>
<b>Lil Tezar</b><br>
<small style="color:#aaa;">Artist</small>
</div>
</div>

<a href="https://www.youtube.com/@LILTEZAR-artist" target="_blank" class="subscribe">
▶ Subscribe
</a>
</div>

<input id="searchBox" placeholder="Search songs...">
<div id="songList"></div>

<div id="playerBox">
<img id="cover">
<h3 id="title"></h3>

<audio id="audio" controls></audio>

<div class="controls">
<button onclick="prevSong()">⏪</button>
<button id="playBtn" onclick="togglePlay()">▶️</button>
<button onclick="nextSong()">⏩</button>
<br>
<button id="downloadBtn">⬇ Download</button>
<button onclick="closePlayer()">❌ Close</button>
</div>
</div>

<!-- ADMIN -->
<div id="adminLogin">
<h3>Admin Login</h3>
<input id="adminUser" placeholder="Username">
<input id="adminPass" type="password" placeholder="Password">
<button onclick="adminLogin()">Login</button>
<p id="adminMsg"></p>
</div>

<div id="adminPanel" style="display:none;">
<h3>Upload Song</h3>

<input id="titleInput" placeholder="Song Title">
<input id="artistInput" placeholder="Artist">
<input id="audioInput" placeholder="Audio URL (Supabase)">
<input id="coverInput" placeholder="Cover URL (Supabase)">

<button onclick="uploadSong()">Upload</button>
<button onclick="logout()">Logout</button>
</div>

<script>
const SUPABASE_URL = "https://ujuwvkzzxiwqcfhptaup.supabase.co";
const SUPABASE_KEY = "sb_publishable_7zCr4dg-xaj7I7syGO685g_Fk_fIbFS";

let songs = [];
let current = 0;
let playing = false;

const audio = document.getElementById("audio");

/* LOAD SONGS */
async function loadSongs(){
try{
const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*`,{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
});

const data = await res.json();

if(!Array.isArray(data)){
console.log(data);
alert("Error loading songs");
return;
}

songs = data;

if(songs.length === 0){
songList.innerHTML = "<p style='padding:10px'>No songs yet</p>";
return;
}

renderSongs(songs);

}catch(err){
console.log(err);
alert("Failed to load songs");
}
}

/* RENDER */
function renderSongs(list){
songList.innerHTML = "";

list.forEach((song,i)=>{
songList.innerHTML += `
<div class="song" onclick="openPlayer(${i})">
<img src="${song.cover_url || 'https://via.placeholder.com/150'}">
<div>
<b>${song.title}</b><br>
<small>${song.artist || ''}</small>
</div>
</div>`;
});
}

/* SEARCH */
searchBox.addEventListener("input",function(){
const v = this.value.toLowerCase();

const filtered = songs.filter(s =>
(s.title || "").toLowerCase().includes(v) ||
(s.artist || "").toLowerCase().includes(v)
);

renderSongs(filtered);
});

/* PLAYER */
function openPlayer(i){
current = i;
const song = songs[i];

cover.src = song.cover_url;
title.innerText = song.title;

audio.src = song.audio_url;
audio.play();

playing = true;
playBtn.innerText = "⏸";

playerBox.style.display = "block";

downloadBtn.onclick = ()=>window.open(song.audio_url);
}

function togglePlay(){
if(playing){
audio.pause();
playBtn.innerText = "▶️";
playing = false;
}else{
audio.play();
playBtn.innerText = "⏸";
playing = true;
}
}

function nextSong(){
current = (current+1)%songs.length;
openPlayer(current);
}

function prevSong(){
current = (current-1+songs.length)%songs.length;
openPlayer(current);
}

function closePlayer(){
playerBox.style.display = "none";
audio.pause();
}

/* ADMIN LOGIN */
function adminLogin(){
const u = adminUser.value;
const p = adminPass.value;

if(u==="Lil Tezar" && p==="Vini123##$$"){
localStorage.setItem("admin","true");
adminLogin.style.display="none";
adminPanel.style.display="block";
}else{
adminMsg.innerText="Wrong login ❌";
}
}

if(localStorage.getItem("admin")==="true"){
adminLogin.style.display="none";
adminPanel.style.display="block";
}

function logout(){
localStorage.removeItem("admin");
location.reload();
}

/* UPLOAD */
async function uploadSong(){
const title = titleInput.value;
const artist = artistInput.value;
const audio_url = audioInput.value;
const cover_url = coverInput.value;

if(!audio_url){
alert("Audio URL required");
return;
}

await fetch(`${SUPABASE_URL}/rest/v1/songs`,{
method:"POST",
headers:{
"Content-Type":"application/json",
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
},
body:JSON.stringify({
title,
artist,
audio_url,
cover_url
})
});

alert("Uploaded ✅");
location.reload();
}

/* INIT */
loadSongs();
</script>

</body>
</html>
