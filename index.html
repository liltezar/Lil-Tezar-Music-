<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lil Tezar App</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px;
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid red;
}

.subscribe{
background:red;
color:white;
padding:6px 12px;
border-radius:20px;
text-decoration:none;
}

/* SONG LIST */
.song{
display:flex;
background:#1a1a1a;
padding:10px;
border-radius:12px;
margin:10px;
cursor:pointer;
}

.song img{
width:55px;
height:55px;
border-radius:10px;
margin-right:10px;
}

/* PLAYER */
#playerBox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:999;
padding:20px;
text-align:center;
}

#playerBox img{
width:200px;
border-radius:15px;
margin-top:40px;
}

.controls button{
background:#222;
color:white;
border:none;
padding:10px;
margin:5px;
border-radius:10px;
font-size:16px;
}

/* SEARCH */
#searchBox{
width:90%;
margin:10px;
padding:10px;
border:none;
border-radius:10px;
}


input{
width:100%;
padding:8px;
margin-bottom:8px;
border-radius:8px;
border:none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="profile">
<img src="profile.jpg">
<div>
<b>Lil Tezar</b><br>
<small style="color:#aaa;">Artist</small>
</div>
</div>

<a href="https://www.youtube.com/@LILTEZAR-artist" target="_blank" class="subscribe">
▶ Subscribe On YouTube 
</a>

</div>

<!-- SEARCH -->
<input id="searchBox" placeholder="Search songs...">

<!-- SONG LIST -->
<div id="songList"></div>

<!-- PLAYER -->
<div id="playerBox">

<img id="cover">
<h3 id="title"></h3>

<audio id="audio"></audio>

<div class="controls">
<button onclick="prevSong()">⏪</button>
<button id="playBtn" onclick="togglePlay()">▶️</button>
<button onclick="nextSong()">⏩</button>
<br>
<button id="downloadBtn">⬇ Download</button>
<button onclick="closePlayer()">❌ Close</button>
</div>

</div>




<script>
const SUPABASE_URL = "https://ujuwvkzzxiwqcfhptaup.supabase.co";
const SUPABASE_KEY = "sb_publishable_7zCr4dg-xaj7I7syGO685g_Fk_fIbFS";

let songs = [];
let current = 0;
let playing = false;

const audio = document.getElementById("audio");

/* LOAD SONGS */
async function loadSongs(){
const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*`,{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
});

songs = await res.json();
renderSongs(songs);
}

/* RENDER */
function renderSongs(list){
const box = document.getElementById("songList");
box.innerHTML = "";

list.forEach((song,i)=>{
box.innerHTML += `
<div class="song" onclick="openPlayer(${i})">
<img src="${song.cover_url}">
<div>
<b>${song.title}</b><br>
<small>${song.artist}</small>
</div>
</div>
`;
});
}

/* SEARCH */
document.getElementById("searchBox").addEventListener("input",function(){
const value = this.value.toLowerCase();

const filtered = songs.filter(song =>
song.title.toLowerCase().includes(value) ||
(song.artist || "").toLowerCase().includes(value)
);

renderSongs(filtered);
});

/* PLAYER */
function openPlayer(i){
current = i;

const song = songs[i];

document.getElementById("cover").src = song.cover_url;
document.getElementById("title").innerText = song.title;

audio.src = song.audio_url;
audio.play();

playing = true;
document.getElementById("playBtn").innerText = "⏸";

document.getElementById("playerBox").style.display = "block";

document.getElementById("downloadBtn").onclick = function(){
window.open(song.audio_url);
};
}

function togglePlay(){
const btn = document.getElementById("playBtn");

if(playing){
audio.pause();
btn.innerText = "▶️";
playing = false;
}else{
audio.play();
btn.innerText = "⏸";
playing = true;
}
}

function nextSong(){
current++;
if(current >= songs.length) current = 0;
openPlayer(current);
}

function prevSong(){
current--;
if(current < 0) current = songs.length - 1;
openPlayer(current);
}

function closePlayer(){
document.getElementById("playerBox").style.display = "none";
audio.pause();
}

/* ADMIN LOGIN */
function adminLogin(){
const user = document.getElementById("adminUser").value;
const pass = document.getElementById("adminPass").value;

if(user === "Lil Tezar" && pass === "Vini123##$$"){
localStorage.setItem("admin","true");
document.getElementById("adminLogin").style.display = "none";
document.getElementById("adminPanel").style.display = "block";
}else{
document.getElementById("adminMsg").innerText = "Wrong login ❌";
}
}

/* AUTO LOGIN */
if(localStorage.getItem("admin") === "true"){
document.getElementById("adminLogin").style.display = "none";
document.getElementById("adminPanel").style.display = "block";
}

/* LOGOUT */
function logout(){
localStorage.removeItem("admin");
location.reload();
}

/* UPLOAD */
async function uploadSong(){

const title = document.getElementById("titleInput").value;
const artist = document.getElementById("artistInput").value;
const audio_url = document.getElementById("audioInput").value;
const cover_url = document.getElementById("coverInput").value;

await fetch(`${SUPABASE_URL}/rest/v1/songs`,{
method:"POST",
headers:{
"Content-Type":"application/json",
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
},
body:JSON.stringify({
title,
artist,
audio_url,
cover_url
})
});

alert("Uploaded ✅");
location.reload();
}

/* INIT */
loadSongs();
</script>

</body>
  </html>
