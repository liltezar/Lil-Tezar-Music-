<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lil Tezar Music</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b0b;
  color: white;
}

/* NAV BAR */
.nav {
  position: sticky;
  top: 0;
  background: #0b0b0b;
  display: flex;
  justify-content: space-around;
  padding: 10px;
  border-bottom: 1px solid #222;
  z-index: 1000;
}

.nav a {
  color: #aaa;
  text-decoration: none;
  font-weight: bold;
}

.nav a:hover {
  color: red;
}

/* HEADER */
.header {
  text-align: center;
  padding: 20px;
}

/* TOP LINKS */
.top-links a {
  color: #aaa;
  text-decoration: none;
  font-size: 14px;
}

.top-links span {
  margin: 0 5px;
  color: #555;
}

/* PROFILE */
.profile {
  background: #1a1a1a;
  margin: 15px;
  border-radius: 20px;
  padding: 20px;
  text-align: center;
}

.profile img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 3px solid red;
}

/* BUTTON */
.subscribe-btn {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 20px;
  background: red;
  color: white;
  border-radius: 20px;
  text-decoration: none;
}

/* SECTION */
.section {
  margin: 20px;
}

/* SONG */
.song {
  display: flex;
  background: #1f1f1f;
  padding: 10px;
  border-radius: 15px;
  margin-bottom: 10px;
}

.song img {
  width: 60px;
  height: 60px;
  border-radius: 10px;
  margin-right: 10px;
}

/* BUTTONS */
.buttons button {
  margin-top: 5px;
  margin-right: 5px;
  background: #333;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 8px;
}

/* PLAYER */
#player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111;
  padding: 10px;
  display: none;
}

audio {
  width: 100%;
}

/* VIDEO */
.video {
  margin-bottom: 15px;
  border-radius: 15px;
  overflow: hidden;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <a href="#music">Music</a>
  <a href="#videos">Videos</a>
  <a href="#photos">Photos</a>
</div>

<!-- HEADER -->
<div class="header">
  <h1>🎵 LIL TEZAR</h1>

  <div class="top-links">
    <a href="#music">Music</a>
    <span>•</span>
    <a href="#stories">Stories</a>
    <span>•</span>
    <a href="#vibes">Vibes</a>
  </div>
</div>

<!-- PROFILE -->
<div class="profile">
  <img src="profile.jpg">
  <h2>LIL TEZAR ✔</h2>
  <p>Artist • Songwriter</p>
  <p>Real pain. Real stories. No fake love.</p>

  <a href="https://www.youtube.com/@LILTEZAR-artist" target="_blank" class="subscribe-btn">
    ▶ Subscribe
  </a>
</div>

<!-- MUSIC -->
<div class="section" id="music">
  <h2>Latest Music</h2>
  <div id="songs">Loading...</div>
</div>

<!-- VIDEOS -->
<div class="section" id="videos">
  <h2>Videos</h2>

  <div class="video">
    <iframe width="100%" height="200"
      src="https://www.youtube.com/embed/NGamrf4B8FI"
      frameborder="0" allowfullscreen>
    </iframe>
  </div>

</div>

<!-- PHOTOS -->
<div class="section" id="photos">
  <h2>Photos</h2>
  <img src="profile.jpg" style="width:100%; border-radius:15px;">
</div>

<!-- STORIES -->
<div class="section" id="stories">
  <h2>Stories</h2>
  <p>Coming soon...</p>
</div>

<!-- VIBES -->
<div class="section" id="vibes">
  <h2>Vibes</h2>
  <p>Behind the scenes & vibes content.</p>
</div>

<!-- PLAYER -->
<div id="player">
  <audio id="audio" controls></audio>
</div>

<script>
const SUPABASE_URL = "https://ujuwvkzzxiwqcfhptaup.supabase.co";
const SUPABASE_KEY = "sb_publishable_7zCr4dg-xaj7I7syGO685g_Fk_fIbFS";

const songsDiv = document.getElementById("songs");
const audio = document.getElementById("audio");
const player = document.getElementById("player");

async function loadSongs() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    });

    const songs = await res.json();
    songsDiv.innerHTML = "";

    songs.forEach(song => {
      const el = document.createElement("div");
      el.className = "song";

      el.innerHTML = `
        <img src="${song.cover_url}">
        <div>
          <b>${song.title}</b><br>
          <small>${song.artist}</small><br>
          <div class="buttons">
            <button class="play">▶ Play</button>
            <button class="download">⬇ Download</button>
          </div>
        </div>
      `;

      el.querySelector(".play").onclick = () => {
        audio.src = song.audio_url;
        player.style.display = "block";
        audio.play();
      };

      el.querySelector(".download").onclick = () => {
        window.open(song.audio_url, "_blank");
      };

      songsDiv.appendChild(el);
    });

  } catch {
    songsDiv.innerHTML = "⚠️ Error loading songs";
  }
}

loadSongs();

/* SERVICE WORKER */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
