<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lil Tezar App</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px;
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid red;
}

.subscribe{
background:red;
color:white;
padding:6px 12px;
border-radius:20px;
text-decoration:none;
}

/* SEARCH */
#searchBox{
width:90%;
margin:10px;
padding:10px;
border:none;
border-radius:10px;
}

/* SONG LIST */
.song{
display:flex;
background:#1a1a1a;
padding:10px;
border-radius:12px;
margin:10px;
cursor:pointer;
}

.song img{
width:55px;
height:55px;
border-radius:10px;
margin-right:10px;
}

/* PLAYER FULLSCREEN */
#playerBox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:999;
text-align:center;
}

#playerBox img{
width:220px;
border-radius:15px;
margin-top:60px;
}

.controls button{
background:#222;
color:white;
border:none;
padding:15px;
margin:10px;
border-radius:12px;
font-size:18px;
}

/* ADMIN */
input{
width:90%;
margin:5px;
padding:10px;
border-radius:8px;
border:none;
}

progress{
width:90%;
margin:10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="profile">
<img src="profile.jpg">
<div>
<b>Lil Tezar</b><br>
<small style="color:#aaa;">Artist</small>
</div>
</div>

<a href="https://www.youtube.com/@LILTEZAR-artist" target="_blank" class="subscribe">
▶ Subscribe
</a>
</div>

<!-- SEARCH -->
<input id="searchBox" placeholder="Search songs...">

<!-- SONG LIST -->
<div id="songList"></div>

<!-- PLAYER -->
<div id="playerBox">
<img id="cover">
<h2 id="title"></h2>

<audio id="audio"></audio>

<div class="controls">
<button onclick="prevSong()">⏪</button>
<button id="playBtn" onclick="togglePlay()">▶️</button>
<button onclick="nextSong()">⏩</button>
<br>
<button id="downloadBtn">⬇ Download</button>
</div>
</div>

<!-- ADMIN LOGIN -->
<div id="adminLogin">
<h3>Admin Login</h3>
<input id="adminUser" placeholder="Username">
<input id="adminPass" type="password" placeholder="Password">
<button onclick="adminLogin()">Login</button>
<p id="adminMsg"></p>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">
<h3>Upload Song</h3>

<input id="titleInput" placeholder="Song Title">
<input id="artistInput" placeholder="Artist">

<label>Audio File (music bucket)</label>
<input type="file" id="audioFile">

<label>Cover Image (cover bucket)</label>
<input type="file" id="coverFile">

<button onclick="uploadSong()">Upload</button>
<button onclick="logout()">Logout</button>

<progress id="progressBar" value="0" max="100"></progress>
</div>
