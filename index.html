<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lil Tezar Music</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px;
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid red;
object-fit:cover;
}

.subscribe{
background:red;
color:white;
padding:6px 12px;
border-radius:20px;
text-decoration:none;
}

/* SONG LIST */
.song{
display:flex;
align-items:center;
gap:10px;
padding:12px;
border-bottom:1px solid #222;
cursor:pointer;
}

.song:hover{
background:#111;
}

.song img{
width:50px;
height:50px;
border-radius:8px;
object-fit:cover;
}

/* PLAYER */
#playerBox{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
padding:20px;
display:none;
text-align:center;
}

#playerBox img{
width:120px;
height:120px;
border-radius:10px;
margin-bottom:10px;
}

/* CONTROLS */
.controls{
text-align:center;
margin-top:10px;
}

.controls button{
width:55px;
height:55px;
margin:8px;
border-radius:50%;
border:none;
background:#222;
color:white;
font-size:18px;
}

#playBtn{
width:70px;
height:70px;
font-size:22px;
background:red;
}

#downloadBtn{
width:auto;
height:auto;
padding:8px 15px;
border-radius:20px;
font-size:14px;
background:#333;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="profile">
<img src="profile.jpg">
<div>
<b>Lil Tezar</b><br>
<small style="color:#aaa;">Artist</small>
</div>
</div>

<a href="https://www.youtube.com/@LILTEZAR-artist" target="_blank" class="subscribe">
▶ Subscribe
</a>

</div>

<!-- SONG LIST -->
<div id="songList"></div>

<!-- PLAYER -->
<div id="playerBox">

<img id="cover">

<h3 id="title"></h3>

<audio id="audio"></audio>

<div class="controls">

<button onclick="prevSong()">⏪</button>

<button id="playBtn" onclick="togglePlay()">▶️</button>

<button onclick="nextSong()">⏩</button>

<br>

<button id="downloadBtn">⬇ Download</button>

</div>

</div>

<script>
const SUPABASE_URL = "https://ujuwvkzzxiwqcfhptaup.supabase.co";
const SUPABASE_KEY = "sb_publishable_7zCr4dg-xaj7I7syGO685g_Fk_fIbFS";

let songs = [];
let current = 0;
let playing = false;

const audio = document.getElementById("audio");

/* LOAD SONGS */
async function loadSongs(){
try{
const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*`,{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
});

songs = await res.json();

songs.forEach((song,i)=>{
document.getElementById("songList").innerHTML += `
<div class="song" onclick="openPlayer(${i})">
<img src="${song.cover_url}">
<div>
<b>${song.title}</b><br>
<small>${song.artist}</small>
</div>
</div>
`;
});

}catch(err){
alert("Error loading songs");
console.log(err);
}
}

/* OPEN PLAYER */
function openPlayer(i){
current = i;

const song = songs[i];

document.getElementById("cover").src = song.cover_url;
document.getElementById("title").innerText = song.title;

audio.src = song.audio_url;
audio.play();

playing = true;
document.getElementById("playBtn").innerText = "⏸";

document.getElementById("playerBox").style.display = "block";

/* DOWNLOAD BUTTON */
document.getElementById("downloadBtn").onclick = function(){
window.open(song.audio_url);
};
}

/* PLAY / PAUSE */
function togglePlay(){
const btn = document.getElementById("playBtn");

if(playing){
audio.pause();
btn.innerText = "▶️";
playing = false;
}else{
audio.play();
btn.innerText = "⏸";
playing = true;
}
}

/* NEXT */
function nextSong(){
current++;
if(current >= songs.length) current = 0;
openPlayer(current);
}

/* PREVIOUS */
function prevSong(){
current--;
if(current < 0) current = songs.length - 1;
openPlayer(current);
}

loadSongs();
</script>

</body>
</html>
