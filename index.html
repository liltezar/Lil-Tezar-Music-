<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lil Tezar App</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

.nav {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#111;
  padding:10px 0;
}

.nav a { color:#aaa; text-decoration:none; }
.nav a.active { color:red; }

.page { display:none; padding:15px; padding-bottom:80px; }
.page.active { display:block; }

.song {
  display:flex;
  background:#1a1a1a;
  padding:10px;
  border-radius:15px;
  margin-bottom:10px;
}

.song img {
  width:60px;
  height:60px;
  border-radius:10px;
  margin-right:10px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.grid img { width:100%; border-radius:10px; }

.video img {
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

.player {
  position:fixed;
  bottom:60px;
  width:100%;
  background:#111;
  padding:10px;
  display:none;
}

button {
  background:#333;
  color:white;
  border:none;
  padding:5px 8px;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
  <div style="display:flex;gap:10px;align-items:center;">
    <img src="profile.jpg" style="width:45px;height:45px;border-radius:50%;border:2px solid red;">
    <div>
