<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lil Tezar App</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:10px;
background:#111;
border-radius:15px;
margin:10px;
}

/* PROFILE */
.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid red;
}

/* BUTTON */
.btn{
background:#24292e;
color:white;
padding:7px 14px;
border-radius:20px;
text-decoration:none;
font-size:13px;
font-weight:bold;
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:#111;
padding:10px 0;
}

.nav a{
color:#aaa;
text-decoration:none;
}

.nav a.active{
color:red;
}

/* PAGE */
.page{
display:none;
padding:15px;
padding-bottom:80px;
}

.page.active{
display:block;
}

/* SONG */
.song{
display:flex;
background:#1a1a1a;
padding:10px;
border-radius:15px;
margin-bottom:10px;
}

.song img{
width:60px;
height:60px;
border-radius:10px;
margin-right:10px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.grid img{
width:100%;
border-radius:10px;
}
