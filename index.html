<input id="artistInput" placeholder="Artist">

<div id="progressBar"></div>
</div>
<p id="progressText">0%</p>
</div>

<script>
const SUPABASE_URL = "https://ujuwvkzzxiwqcfhptaup.supabase.co";
const SUPABASE_KEY = "sb_publishable_7zCr4dg-xaj7I7syGO685g_Fk_fIbFS";

let songs = [];
let current = 0;
let playing = false;

const audio = document.getElementById("audio");

/* LOAD SONGS */
async function loadSongs(){
try{
const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*`,{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
});

const data = await res.json();

if(!Array.isArray(data)){
alert("Supabase error");
return;
}

songs = data;

if(songs.length === 0){
songList.innerHTML = "<p style='padding:15px;'>No songs yet</p>";
return;
}

renderSongs(songs);

}catch(err){
console.log(err);
alert("Failed to load songs");
}
}

/* RENDER */
function renderSongs(list){
songList.innerHTML = "";

list.forEach((song,i)=>{
songList.innerHTML += `
<div class="song" onclick="openPlayer(${i})">
<img src="${song.cover_url}">
<div>
<b>${song.title}</b><br>
<small>${song.artist}</small>
</div>
</div>`;
});
}

/* SEARCH */
searchBox.addEventListener("input",function(){
const v = this.value.toLowerCase();

renderSongs(
songs.filter(s =>
(s.title||"").toLowerCase().includes(v) ||
(s.artist||"").toLowerCase().includes(v)
)
);
});

/* PLAYER */
function openPlayer(i){
current = i;
const song = songs[i];

cover.src = song.cover_url;
title.innerText = song.title;

audio.src = song.audio_url;
audio.play();

playing = true;
playBtn.innerText = "⏸";

playerBox.style.display = "flex";

downloadBtn.onclick = ()=>window.open(song.audio_url);
}

playerBox.onclick = function(e){
if(e.target.id === "playerBox"){
audio.pause();
this.style.display = "none";
}
};

function togglePlay(){
if(playing){
audio.pause();
playBtn.innerText = "▶️";
playing=false;
}else{
audio.play();
playBtn.innerText = "⏸";
playing=true;
}
}

function nextSong(){
current = (current+1)%songs.length;
openPlayer(current);
}

function prevSong(){
current = (current-1+songs.length)%songs.length;
openPlayer(current);
}

/* ADMIN LOGIN */
function adminLogin(){
if(adminUser.value==="Lil Tezar" && adminPass.value==="Vini123##$$"){
localStorage.setItem("admin","true");
adminLogin.style.display="none";
adminPanel.style.display="block";
}else{
adminMsg.innerText="Wrong login ❌";
}
}

if(localStorage.getItem("admin")==="true"){
adminLogin.style.display="none";
adminPanel.style.display="block";
}

function logout(){
localStorage.removeItem("admin");
location.reload();
}
