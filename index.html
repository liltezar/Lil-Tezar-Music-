<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Lil Tezar Music</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    .header {
      text-align: center;
      padding: 20px;
    }

    .profile {
      background: #1a1a1a;
      margin: 15px;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255,0,0,0.2);
    }

    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #ff1a1a;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
    }

    .role {
      color: #aaa;
      margin: 5px 0;
    }

    .bio {
      margin: 10px 0;
      font-size: 14px;
      color: #ccc;
    }

    .subscribe-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: red;
      color: white;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
    }

    .subscribe-btn:hover {
      box-shadow: 0 0 10px red;
    }

    .section {
      margin: 20px;
    }

    .song {
      display: flex;
      align-items: center;
      background: #1f1f1f;
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .song img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      margin-right: 10px;
    }

    .title {
      font-weight: bold;
    }

    .artist {
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🎵 LIL TEZAR</h1>
    <p>Music • Stories • Vibes</p>
  </div>

  <!-- PROFILE -->
  <div class="profile">
    
    <!-- 🔥 YOUR REAL IMAGE -->
    <img src="your-profile.jpg" alt="Lil Tezar">

    <div class="name">LIL TEZAR ✔</div>
    <div class="role">Artist • Songwriter</div>

    <div class="bio">
      Real pain. Real stories. No fake love.
    </div>

    <!-- 🔥 YOUTUBE SUBSCRIBE BUTTON -->
    <a href="https://www.youtube.com/@LILTEZAR-artist" target="_blank" class="subscribe-btn">
      ▶ Subscribe
    </a>

  </div>

  <!-- MUSIC SECTION -->
  <div class="section">
    <h2>Latest Music</h2>

    <div id="songs"></div>
  </div>

</body>
</html>
