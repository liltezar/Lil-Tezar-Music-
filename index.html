<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lil Tezar Music</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 18px;
      background: #111;
      border-bottom: 1px solid #222;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
    }

    header p {
      color: #999;
      margin-top: 6px;
      font-size: 13px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px 15px 120px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h2 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .welcome p {
      color: #888;
    }

    .song {
      background: #151515;
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cover {
      width: 75px;
      height: 75px;
      border-radius: 10px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
    }

    .buttons {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 8px 13px;
      cursor: pointer;
      font-weight: bold;
    }

    .play {
      background: white;
      color: black;
    }

    .download {
      background: #292929;
      color: white;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #151515;
      border-top: 1px solid #292929;
      padding: 12px 15px;
      display: none;
      z-index: 1000;
    }

    .player-title {
      font-size: 13px;
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    audio {
      width: 100%;
    }

    .loading,
    .error,
    .empty {
      text-align: center;
      padding: 40px 15px;
      color: #888;
    }

    .error {
      color: #ff7777;
    }
  </style></head><body><header>
  <h1>🎵 LIL TEZAR MUSIC</h1>
  <p>Music • Stories • Vibes</p>
</header><div class="container">  <div class="welcome">
    <h2>Latest Music</h2>
    <p>Listen to Lil Tezar and more.</p>
  </div>  <div id="songs">
    <div class="loading">Loading music...</div>
  </div></div><div class="player" id="player">
  <div class="player-title" id="playerTitle"></div>
  <audio id="audio" controls preload="none"></audio>
</div><script>

const SUPABASE_URL =
  "https://ujuwvkzzxiwqcfhptaup.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7zCr4dg-xaj7I7syGO685g_Fk_fIbFS";

const songsContainer = document.getElementById("songs");
const audio = document.getElementById("audio");
const player = document.getElementById("player");
const playerTitle = document.getElementById("playerTitle");


async function loadSongs() {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/songs?select=*`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("Could not load songs.");
    }

    const songs = await response.json();

    songsContainer.innerHTML = "";

    if (!songs.length) {
      songsContainer.innerHTML =
        `<div class="empty">No songs available yet.</div>`;
      return;
    }

    songs.forEach(song => {

      /*
        IMPORTANT:
        We use the URLs already stored in Supabase.
      */

      const cover =
        song.cover_url || "";

      const audioUrl =
        song.audio_url || "";


      const card = document.createElement("div");
      card.className = "song";

      card.innerHTML = `
        <img
          class="cover"
          src="${cover}"
          alt="${song.title || "Song cover"}"
        >

        <div class="info">

          <div class="title">
            ${song.title || "Untitled"}
          </div>

          <div class="artist">
            ${song.artist || "Unknown artist"}
          </div>

          <div class="buttons">

            <button class="play">
              ▶ Play
            </button>

            <button class="download">
              📥 Download
            </button>

          </div>

        </div>
      `;


      const playButton =
        card.querySelector(".play");

      const downloadButton =
        card.querySelector(".download");


      playButton.onclick = async () => {

        if (!audioUrl) {
          alert("This song has no audio URL.");
          return;
        }

        audio.pause();

        audio.src = audioUrl;

        playerTitle.textContent =
          `${song.title || "Untitled"} — ${song.artist || "Unknown artist"}`;

        player.style.display = "block";

        try {

          await audio.play();

          playButton.textContent = "⏸ Playing";

        } catch (error) {

          console.error("Playback error:", error);

          alert(
            "The song could not play. Please check the audio file in Supabase."
          );

        }

      };


      downloadButton.onclick = () => {

        if (!audioUrl) {
          alert("Download unavailable for this song.");
          return;
        }

        const link =
          document.createElement("a");

        link.href = audioUrl;

        link.download =
          `${song.title || "song"}.m4a`;

        link.target = "_blank";

        document.body.appendChild(link);

        link.click();

        link.remove();

      };


      songsContainer.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    songsContainer.innerHTML =
      `<div class="error">
        Could not load music.<br>
        Check your Supabase connection.
      </div>`;

  }

}


audio.addEventListener("ended", () => {

  document.querySelectorAll(".play").forEach(button => {
    button.textContent = "▶ Play";
  });

});


audio.addEventListener("pause", () => {

  document.querySelectorAll(".play").forEach(button => {

    if (button.textContent === "⏸ Playing") {
      button.textContent = "▶ Play";
    }

  });

});


loadSongs();

</script></body>
</html>
