<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lil Tezar App</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* NAV */
.nav {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#111;
  padding:10px 0;
}

.nav a {
  color:#aaa;
  text-decoration:none;
}

.nav a.active {
  color:red;
}

/* SECTIONS */
.page {
  display:none;
  padding:15px;
}

.page.active {
  display:block;
}

/* SONG */
.song {
  display:flex;
  background:#1a1a1a;
  padding:10px;
  border-radius:15px;
  margin-bottom:10px;
}

.song img {
  width:60px;
  height:60px;
  border-radius:10px;
  margin-right:10px;
}

/* PLAYER */
.player {
  position:fixed;
  bottom:60px;
  width:100%;
  background:#111;
  padding:10px;
  display:none;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <h2>Home</h2>

  <h3>Recent Music</h3>
  <div id="homeSongs"></div>

  <h3>Latest Video</h3>
  <div id="homeVideo"></div>

  <h3>Photos</h3>
  <img src="profile.jpg" style="width:100%;border-radius:15px;">
</div>

<!-- MUSIC -->
<div id="music" class="page">
  <h2>Music</h2>
  <div id="musicList"></div>
</div>

<!-- VIDEOS -->
<div id="videos" class="page">
  <h2>Videos</h2>

  <div onclick="playVideo('NGamrf4B8FI')">
    <img src="https://img.youtube.com/vi/NGamrf4B8FI/0.jpg" style="width:100%;border-radius:15px;">
  </div>

  <div id="videoPlayer"></div>
</div>

<!-- PHOTOS -->
<div id="photos" class="page">
  <h2>Photos</h2>
  <img src="profile.jpg" style="width:100%;border-radius:15px;">
</div>

<!-- PLAYER -->
<div class="player" id="player">
  <audio id="audio" controls></audio>
</div>

<!-- NAV BAR -->
<div class="nav">
  <a onclick="showPage('home')" class="active">Home</a>
  <a onclick="showPage('music')">Music</a>
  <a onclick="showPage('videos')">Videos</a>
  <a onclick="showPage('photos')">Photos</a>
</div>

<script>
const SUPABASE_URL = "https://ujuwvkzzxiwqcfhptaup.supabase.co";
const SUPABASE_KEY = "YOUR_KEY";

let songs = [];
const audio = document.getElementById("audio");
const player = document.getElementById("player");

/* PAGE SWITCH */
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav a").forEach(a => a.classList.remove("active"));
  event.target.classList.add("active");
}

/* LOAD SONGS */
async function loadSongs() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    }
  });

  songs = await res.json();

  songs.forEach((song, i) => {
    const html = `
      <div class="song">
        <img src="${song.cover_url}">
        <div>
          <b>${song.title}</b><br>
          <small>${song.artist}</small><br>
          <button onclick="playSong(${i})">▶</button>
        </div>
      </div>
    `;

    document.getElementById("musicList").innerHTML += html;

    if (i < 2) {
      document.getElementById("homeSongs").innerHTML += html;
    }
  });

  /* HOME VIDEO */
  document.getElementById("homeVideo").innerHTML = `
    <iframe width="100%" height="200"
    src="https://www.youtube.com/embed/NGamrf4B8FI"
    frameborder="0"></iframe>`;
}

/* PLAYER */
function playSong(i) {
  audio.src = songs[i].audio_url;
  player.style.display = "block";
  audio.play();
}

/* VIDEO */
function playVideo(id) {
  document.getElementById("videoPlayer").innerHTML =
    `<iframe width="100%" height="200"
    src="https://www.youtube.com/embed/${id}?autoplay=1"
    frameborder="0"></iframe>`;
}

loadSongs();

/* SERVICE WORKER */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
