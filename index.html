<title>Lil Tezar App</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* NAV */
.nav {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#111;
  padding:10px 0;
}

.nav a {
  color:#aaa;
  text-decoration:none;
}

.nav a.active {
  color:red;
}

/* PAGE */
.page {
  display:none;
  padding:15px;
  padding-bottom:80px;
}

.page.active {
  display:block;
}

/* SONG */
.song {
  display:flex;
  background:#1a1a1a;
  padding:10px;
  border-radius:15px;
  margin-bottom:10px;
}

.song img {
  width:60px;
  height:60px;
  border-radius:10px;
  margin-right:10px;
}

/* PHOTO GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.grid img {
  width:100%;
  border-radius:10px;
}

/* VIDEO */
.video img {
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

/* PLAYER */
.player {
  position:fixed;
  bottom:60px;
  width:100%;
  background:#111;
  padding:10px;
  display:none;
}

button {
  background:#333;
  color:white;
  border:none;
  padding:5px 8px;
  border-radius:8px;
  margin-top:5px;
}
</style>
</head>
