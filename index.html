<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Lil Tezar Music</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    .header {
      text-align: center;
      padding: 20px;
    }

    .profile {
      background: #1a1a1a;
      margin: 15px;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255,0,0,0.2);
    }

    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ff1a1a;
    }

    .name { font-size: 22px; font-weight: bold; }
    .role { color: #aaa; }
    .bio { font-size: 14px; color: #ccc; margin-top: 8px; }

    .subscribe-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: red;
      color: white;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
    }

    .section { margin: 20px; }

    .song {
      display: flex;
      align-items: center;
      background: #1f1f1f;
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .song img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      margin-right: 10px;
    }

    .title { font-weight: bold; }
    .artist { font-size: 13px; color: #aaa; }

    .buttons button {
      margin-right: 5px;
      background: #333;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Player */
    #player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111;
      padding: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🎵 LIL TEZAR</h1>
    <p>Music • Stories • Vibes</p>
  </div>

  <!-- PROFILE -->
  <div class="profile">
    <img src="your-profile.jpg" alt="Lil Tezar">

    <div class="name">LIL TEZAR ✔</div>
    <div class="role">Artist • Songwriter</div>

    <div class="bio">Real pain. Real stories. No fake love.</div>

    <a href="https://www.youtube.com/@LILTEZAR-artist" target="_blank" class="subscribe-btn">
      ▶ Subscribe
    </a>
  </div>

  <!-- MUSIC -->
  <div class="section">
    <h2>Latest Music</h2>
    <div id="songs">Loading...</div>
  </div>

  <!-- AUDIO PLAYER -->
  <div id="player">
    <audio id="audio" controls></audio>
  </div>

<script>
const SUPABASE_URL = "https://ujuwvkzzxiwqcfhptaup.supabase.co";
const SUPABASE_KEY = "sb_publishable_7zCr4dg-xaj7I7syGO685g_Fk_fIbFS";

const songsDiv = document.getElementById("songs");
const audio = document.getElementById("audio");
const player = document.getElementById("player");

/* LOAD SONGS */
async function loadSongs() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    });

    const songs = await res.json();
    songsDiv.innerHTML = "";

    if (!songs.length) {
      songsDiv.innerHTML = "No songs found.";
      return;
    }

    songs.forEach(song => {
      const el = document.createElement("div");
      el.className = "song";

      el.innerHTML = `
        <img src="${song.cover_url || 'https://via.placeholder.com/70'}">
        <div>
          <div class="title">${song.title}</div>
          <div class="artist">${song.artist}</div>

          <div class="buttons">
            <button>▶ Play</button>
            <button>⬇ Download</button>
          </div>
        </div>
      `;

      const [playBtn, downloadBtn] = el.querySelectorAll("button");

      playBtn.onclick = () => {
        audio.src = song.audio_url;
        player.style.display = "block";
        audio.play();
      };

      downloadBtn.onclick = () => {
        window.open(song.audio_url, "_blank");
      };

      songsDiv.appendChild(el);
    });

  } catch (err) {
    songsDiv.innerHTML = "⚠️ Offline or Supabase error";
    console.log(err);
  }
}

loadSongs();
</script>

</body>
</html>
