<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lil Tezar App</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:#111;
padding:10px 0;
}

.nav a{
color:#aaa;
text-decoration:none;
}

.nav a.active{
color:red;
}

/* PAGE */
.page{
display:none;
padding:15px;
padding-bottom:80px;
}

.page.active{
display:block;
}

/* SONG */
.song{
display:flex;
background:#1a1a1a;
padding:10px;
border-radius:15px;
margin-bottom:10px;
}

.song img{
width:60px;
height:60px;
border-radius:10px;
margin-right:10px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.grid img{
width:100%;
border-radius:10px;
cursor:pointer;
}

/* PLAYER */
.player{
position:fixed;
bottom:60px;
width:100%;
background:#111;
padding:10px;
display:none;
}

button{
background:#333;
color:white;
border:none;
padding:5px 8px;
border-radius:8px;
margin-top:5px;
cursor:pointer;
}

/* FULLSCREEN */
#viewer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
justify-content:center;
align-items:center;
z-index:9999;
}

#viewer img{
max-width:95%;
max-height:95%;
border-radius:10px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;">

<div style="display:flex;align-items:center;gap:10px;">
<img src="images/profile.png" style="width:45px;height:45px;border-radius:50%;border:2px solid red;">
<div>
<b>Lil Tezar</b><br>
<small style="color:#aaa;">Artist</small>
</div>
</div>

<a href="https://www.youtube.com/@LILTEZAR-artist" target="_blank"
style="background:red;color:white;padding:6px 12px;border-radius:20px;text-decoration:none;">
▶ Subscribe
</a>

</div>

<h2>Home</h2>

<h3>Recently Added</h3>
<div id="homeSongs"></div>

<h3>Latest Video</h3>
<div id="homeVideo"></div>

</div>

<!-- MUSIC -->
<div id="music" class="page">
<h2>Music</h2>
<div id="musicList"></div>
</div>

<!-- VIDEOS -->
<div id="videos" class="page">
<h2>Videos</h2>
<div id="videoList"></div>
<div id="videoPlayer"></div>
</div>

<!-- PHOTOS -->
<div id="photos" class="page">
<h2>Photos</h2>
<div class="grid" id="photoGrid"></div>
</div>

<!-- PLAYER -->
<div class="player" id="player">
<audio id="audio" controls></audio>
</div>

<!-- FULLSCREEN VIEWER -->
<div id="viewer" onclick="closeViewer()">
<img id="viewerImg">
</div>

<!-- NAV -->
<div class="nav">
<a onclick="showPage(event,'home')" class="active">Home</a>
<a onclick="showPage(event,'music')">Music</a>
<a onclick="showPage(event,'videos')">Videos</a>
<a onclick="showPage(event,'photos')">Photos</a>
</div>

<script>
const SUPABASE_URL = "https://ujuwvkzzxiwqcfhptaup.supabase.co";
const SUPABASE_KEY = "sb_publishable_7zCr4dg-xaj7I7syGO685g_Fk_fIbFS";

let songs = [];
const audio = document.getElementById("audio");
const player = document.getElementById("player");

/* NAV */
function showPage(e,id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");

document.querySelectorAll(".nav a").forEach(a=>a.classList.remove("active"));
e.target.classList.add("active");
}

/* LOAD SONGS */
async function loadSongs(){
try{
const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*`,{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
});

songs = await res.json();
songs.reverse();

document.getElementById("musicList").innerHTML="";
document.getElementById("homeSongs").innerHTML="";

songs.forEach((song,i)=>{

let plays = localStorage.getItem("plays_"+i)||0;
let liked = localStorage.getItem("liked_"+i);

const html = `
<div class="song">
<img src="${song.cover_url}">
<div>
<b>${song.title}</b><br>
<small>${song.artist}</small><br>

<button onclick="playSong(${i})">▶</button>

<button onclick="likeSong(${i}, this)">
${liked ? "❤️ Liked" : "🤍 Like"}
</button>

<button onclick="window.open('${song.audio_url}')">⬇</button>

<br>
<small>Plays: <span id="plays_${i}">${plays}</span></small>
</div>
</div>
`;

document.getElementById("musicList").innerHTML += html;

if(i < 2){
document.getElementById("homeSongs").innerHTML += html;
}
});

document.getElementById("homeVideo").innerHTML = `
<iframe width="100%" height="200"
src="https://www.youtube.com/embed/NGamrf4B8FI"
frameborder="0"></iframe>`;
}catch(err){
console.log("ERROR:",err);
}
}

/* PLAY */
function playSong(i){
audio.src = songs[i].audio_url;
player.style.display = "block";

audio.play().catch(()=>{
alert("Audio failed — check your Supabase audio URL");
});

let plays = localStorage.getItem("plays_"+i)||0;
plays++;
localStorage.setItem("plays_"+i,plays);

document.getElementById("plays_"+i).innerText = plays;
}

/* LIKE (ONCE ONLY) */
function likeSong(i,btn){
if(localStorage.getItem("liked_"+i)) return;

localStorage.setItem("liked_"+i,true);
btn.innerText = "❤️ Liked";
}

/* VIDEOS */
const videos = ["NGamrf4B8FI","ex1RZgZoWuk"];

videos.forEach(id=>{
document.getElementById("videoList").innerHTML += `
<div onclick="playVideo('${id}')">
<img src="https://img.youtube.com/vi/${id}/0.jpg" style="width:100%;border-radius:10px;margin-bottom:10px;">
</div>`;
});

function playVideo(id){
document.getElementById("videoPlayer").innerHTML = `
<iframe width="100%" height="220"
src="https://www.youtube.com/embed/${id}?autoplay=1"></iframe>`;
}

/* PHOTOS */
const photos = [
"images/cover1.png",
"images/cover2.png",
"images/cover3.png"
];

photos.forEach(src=>{
document.getElementById("photoGrid").innerHTML += `
<img src="${src}" onclick="openViewer('${src}')">
`;
});

/* FULLSCREEN */
function openViewer(src){
document.getElementById("viewer").style.display = "flex";
document.getElementById("viewerImg").src = src;
}

function closeViewer(){
document.getElementById("viewer").style.display = "none";
}

/* INIT */
loadSongs();

/* SERVICE WORKER */
if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
